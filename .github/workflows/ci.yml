name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - name: Build
        run: go build ./...
        working-directory: backend
      - name: Test
        run: go test ./...
        working-directory: backend
